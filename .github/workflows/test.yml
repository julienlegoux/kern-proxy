name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # -v so the run log shows each test by name — the epic's acceptance
      # criteria require TestResolveExpiredOAuthRefreshesOnceUnderLock to be
      # visibly executed under the race detector.
      - run: go test ./... -race -v

      # Offline test of upstream/sync.sh's diff-detection logic (no network:
      # builds its own throwaway git repo). Keeps the weekly sync job in
      # .github/workflows/upstream-sync.yml honest between real upstream
      # syncs.
      - run: bash upstream/sync_test.sh
